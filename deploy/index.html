<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KATUP</title>
<style>
body{margin:0;background:#102131;color:#ecf6f7;font:16px system-ui}header{padding:12px 18px}h1{margin:0 0 8px}button,select{font:inherit;padding:9px;margin:4px;border:0;border-radius:5px}button{background:#42d8bc;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#stop{background:#f49c91}#stage{position:relative;width:100%;height:72vh;height:72dvh;min-height:300px;background:#000}#screen{width:100%;height:100%}#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:#142b39;text-align:center}#empty[hidden]{display:none}#empty p{max-width:480px;line-height:1.5}#status{margin:8px 0}small{display:block;color:#bdced0}@media(max-width:600px){#stage{height:62vh;height:62dvh;min-height:250px}header{padding:12px}select{max-width:100%}}
</style>
<header><h1>KATUP</h1><small>Satu sesi langsung di VPS. Semua pengguna melihat dan mengendalikan simulasi yang sama.</small><select id="mode"><option value="katup">KATUP — tiga agen</option><option value="baseline">Baseline — tanpa kendali KATUP</option></select><label>Kecepatan <select id="speed"><option value="1000">Waktu nyata — ±30 menit</option><option value="200" selected>5× — ±6 menit</option><option value="100">10× — ±3 menit</option></select></label><button id="start">Mulai / Ganti skenario</button><button id="stop">Hentikan</button><button id="reconnect">Hubungkan desktop</button><label><input type="checkbox" id="view">Hanya lihat</label><div id="status" role="status">Memuat status…</div><small id="connection"></small><small id="timing">Kecepatan diterapkan saat Mulai. Bisa diubah juga lewat Delay di toolbar SUMO.</small></header>
<div id="stage"><div id="screen"></div><div id="empty"><div><h2 id="empty-title">Memuat simulasi…</h2><p id="empty-message">Memeriksa sesi yang sedang berjalan.</p><button id="start-empty" hidden>Mulai simulasi</button></div></div></div>
<script type="module">
import RFB from '/novnc/core/rfb.js';
let rfb;
const q=id=>document.getElementById(id);
async function connect(){if(rfb)rfb.disconnect();q('connection').textContent='Menghubungkan desktop…';const response=await fetch('/api/desktop');if(response.redirected){location='/login';return}const creds=await response.json();rfb=new RFB(q('screen'),`wss://${location.host}/websockify`,{credentials:{password:creds.password}});rfb.qualityLevel=5;rfb.compressionLevel=2;rfb.scaleViewport=true;rfb.resizeSession=false;rfb.viewOnly=q('view').checked;rfb.addEventListener('connect',()=>q('connection').textContent='Desktop terhubung. Saat simulasi berjalan, gunakan toolbar SUMO untuk jeda dan zoom.');rfb.addEventListener('disconnect',()=>q('connection').textContent='Desktop terputus. Tekan Hubungkan desktop.');}
async function command(path){q('start').disabled=q('stop').disabled=q('start-empty').disabled=true;try{const r=await fetch(path,{method:'POST'});if(!r.ok)throw Error(await r.text());await status();}catch(e){q('status').textContent='Perintah gagal. Silakan coba lagi.';console.error(e)}finally{q('start').disabled=q('stop').disabled=q('start-empty').disabled=false}}
async function status(){try{const r=await fetch('/api/status');if(r.redirected){location='/login';return}if(!r.ok)throw Error('Status gagal');const s=await r.json(),t=s.telemetry;const finished=!s.running&&(t.simulation_time||0)>=1800;q('empty').hidden=s.running&&(t.simulation_time||0)>0;q('start-empty').hidden=s.running;q('stop').disabled=!s.running;
if(s.running){if(t.gui_delay_ms){q('timing').textContent=`Kecepatan awal sesi: ${1000/t.gui_delay_ms}× (durasi sekitar ${1800*t.gui_delay_ms/60000} menit). Pilihan baru diterapkan saat Mulai.`;}if(!(t.simulation_time>0)){q('empty-title').textContent='Menyiapkan SUMO-GUI…';q('empty-message').textContent='Simulasi sedang dimulai. Peta akan tampil beberapa saat lagi.';}q('status').textContent=`Berjalan | ${t.scenario||q('mode').value} | Waktu simulasi: ${t.simulation_time||0} / 1800 detik | Kendaraan: ${t.vehicles||0}`;}
else{q('status').textContent=finished?'Simulasi selesai — 1800 detik. Tekan Mulai untuk sesi baru.':'Simulasi belum berjalan. Pilih skenario lalu tekan Mulai.';q('empty-title').textContent=finished?'Simulasi selesai':'Siap menjalankan simulasi';q('empty-message').textContent=finished?'Sesi sebelumnya sudah mencapai 1800 detik. Tekan tombol di bawah untuk menjalankan simulasi langsung yang baru.':'Pilih Baseline atau KATUP di atas, lalu mulai. Peta dan kendaraan SUMO akan tampil di sini.';q('start-empty').textContent=finished?'Mulai sesi baru':'Mulai simulasi';}}
catch{q('status').textContent='Koneksi status terputus. Mencoba menghubungkan kembali…';}}
const start=()=>command('/api/start/'+q('mode').value+'?delay_ms='+q('speed').value);
q('start').onclick=start;q('start-empty').onclick=start;q('stop').onclick=()=>command('/api/stop');q('reconnect').onclick=()=>connect().catch(()=>q('connection').textContent='Gagal menghubungkan desktop. Coba lagi.');q('view').onchange=()=>{if(rfb)rfb.viewOnly=q('view').checked};setInterval(status,2000);status();connect().catch(()=>q('connection').textContent='Gagal menghubungkan desktop. Tekan Hubungkan desktop.');
</script></html>
